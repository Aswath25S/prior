name: Feature request
description: Propose a focused improvement or extension.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - Inbound Triage Copilot
        - TabPFN Use-Case Discovery
        - Repository tooling or documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Describe the smallest useful version and important tradeoffs.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data and external-service impact
      description: Does this change persistence, uploaded data, or information sent to an API?
    validations:
      required: true

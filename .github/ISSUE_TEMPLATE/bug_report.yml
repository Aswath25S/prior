name: Bug report
description: Report reproducible behavior that is incorrect or unexpected.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - Inbound Triage Copilot
        - TabPFN Use-Case Discovery
        - Repository tooling or documentation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: Include the smallest safe example that reproduces the issue. Do not include secrets or private data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and browser if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove API keys, personal information, and proprietary data before posting.
